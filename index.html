<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fdcff">
<title>TT Tic-Tac-Toe · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%2318d4ff'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%E2%AD%95%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('⭕', '#18d4ff');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffd400;
    --pink: #ff3d7f;
    --cyan: #18d4ff;
    --mint: #3fe0b0;
    --orange: #ff8a1f;
    --x: #2f7cf0;
    --o: #ff8a1f;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    --pad: max(12px, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #9fdcff; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; z-index: 8; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .chip { display: inline-grid; place-items: center; font-style: normal; font-family: var(--display); line-height: 1; }
  .chip.x { color: var(--x); }
  .chip.o { color: var(--o); }

  /* ---------- big chunky buttons ---------- */
  .bigbtn {
    min-width: clamp(78px, 13vmin, 112px); height: clamp(78px, 13vmin, 112px); border-radius: 28px; padding: 0 18px;
    font-size: clamp(40px, 7vmin, 58px); line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #ffffff, #e9e3ff); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #8ef56b, #2dbf4e); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn .word { font-family: var(--display); font-size: clamp(22px, 4.4vmin, 36px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); color: #fff; }
  .bigbtn:active, .tile:active, .seg button:active, .ibtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: clamp(52px, 8vmin, 72px); height: clamp(52px, 8vmin, 72px); border-radius: 20px; font-size: clamp(26px, 4.4vmin, 36px); line-height: 1;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2.2vh, 20px); transition: opacity 0.3s; padding: 12px; }
  @media (min-aspect-ratio: 115/100) { #home { left: 46vw; right: max(10px, env(safe-area-inset-right)); top: 0; bottom: 0; } }
  @media (max-aspect-ratio: 115/100) { #home { left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); height: 62vh; justify-content: flex-start; padding-left: 62px; } }
  .logo { text-align: center; font-family: var(--display); line-height: 0.92; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(26px, 5vmin, 44px); color: var(--cyan); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(42px, 9vmin, 88px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 12px 24px rgba(0,0,0,.2); letter-spacing: 1px; white-space: nowrap; }
  .tiles { display: flex; gap: clamp(12px, 3vmin, 28px); }
  .tile {
    position: relative; width: clamp(140px, 25vmin, 250px); aspect-ratio: 1 / 0.86; border-radius: 32px; border: 6px solid #fff;
    box-shadow: 0 9px 0 var(--ink); overflow: hidden; transition: transform 0.08s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%;
  }
  .tile:hover { transform: translateY(-3px) rotate(-1deg); }
  .tile.reg { background: radial-gradient(circle at 50% 35%, #fff3c4, #ffc93c); }
  .tile.spin { background: radial-gradient(circle at 50% 35%, #d8f4ff, #4ab8ff); }
  .tile b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3.8vmin, 34px); color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
  .tile .go { position: absolute; right: 6px; top: 6px; width: 24%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(160deg, #8ef56b, #2dbf4e); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; font-size: clamp(18px, 3.6vmin, 32px); }
  .minigrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 46%; aspect-ratio: 1; padding: 5px; border-radius: 12px; background: #c98a4b; box-shadow: 0 4px 0 rgba(20,18,31,.35); }
  .minigrid i { border-radius: 6px; background: #fff7e4; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: clamp(12px, 2.6vmin, 24px); line-height: 1; }
  .minigrid i.win { background: #fff27a; }
  .cycle { display: flex; align-items: center; gap: 2px; font-family: var(--display); font-size: clamp(22px, 4.4vmin, 40px); line-height: 1; }
  .cycle .sq { width: 1.15em; height: 1.15em; border-radius: 0.26em; background: #fff7e4; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(20,18,31,.35); animation: flip 2.4s ease-in-out infinite; }
  .cycle .sq:nth-child(3) { animation-delay: 0.8s; }
  .cycle .sq:nth-child(5) { animation-delay: 1.6s; }
  .cycle .arr { color: #fff; font-size: 0.6em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  @keyframes flip { 0%, 30%, 100% { transform: rotateX(0); } 15% { transform: rotateX(180deg) translateY(-4px); } }
  .opts { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); }
  .seg { display: flex; gap: 8px; }
  .seg button {
    display: flex; align-items: center; gap: 8px; height: clamp(52px, 8.5vmin, 72px); padding: 0 16px 0 10px; border-radius: 22px; border: 4px solid #fff;
    background: rgba(255, 255, 255, 0.55); box-shadow: 0 5px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(15px, 2.8vmin, 24px); transition: transform 0.12s;
  }
  .seg button img { height: 80%; aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .seg button .emo { font-size: 1.3em; }
  .seg button .chip { font-size: 1.3em; }
  .seg button.on { background: linear-gradient(160deg, #fffbe0, #ffd84a); border-color: var(--yellow); box-shadow: 0 0 0 4px var(--ink), 0 6px 0 4px var(--ink); transform: scale(1.06); }
  .duo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(16px, 3vmin, 26px); color: var(--ink); background: rgba(255,255,255,.55); border: 4px solid #fff; border-radius: 22px; padding: 4px 14px 4px 6px; box-shadow: 0 5px 0 var(--ink); }
  .duo img { width: clamp(44px, 7vmin, 62px); aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .duo .chip { font-size: 1.3em; }
  .duo .vs { color: var(--pink); }
  @media (max-height: 430px) {
    /* a phone on its side: the menu a size smaller so it all fits */
    #home { gap: 6px; padding: 6px; }
    .logo small { font-size: 18px; -webkit-text-stroke-width: 2px; }
    .logo big { font-size: 34px; text-shadow: 0 4px 0 var(--ink); }
    .tile { width: 118px; border-width: 4px; border-radius: 24px; }
    .tile b { font-size: 16px; }
    .seg button { height: 44px; font-size: 14px; border-radius: 16px; padding: 0 10px 0 6px; }
    .opts { gap: 6px; }
    .duo { font-size: 14px; }
    .duo img { width: 38px; }
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  .hudtop { position: absolute; left: var(--pad); right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .hudtop > button { pointer-events: auto; flex-shrink: 0; }
  .hudmid { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .score { display: flex; align-items: center; gap: clamp(6px, 1.4vmin, 12px); padding: 5px 8px; border-radius: 999px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; }
  .score .side { display: flex; align-items: center; gap: clamp(4px, 1vmin, 8px); border-radius: 999px; padding: 2px; transition: box-shadow 0.2s, background 0.2s; }
  .score .side.now { background: rgba(255, 212, 0, 0.35); box-shadow: 0 0 0 3px var(--yellow); }
  .score img { width: clamp(38px, 6.5vmin, 56px); height: clamp(38px, 6.5vmin, 56px); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .score .chip { width: clamp(30px, 5vmin, 42px); height: clamp(30px, 5vmin, 42px); border-radius: 50%; background: #fff; font-size: clamp(18px, 3.4vmin, 28px); }
  .score b { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vmin, 42px); line-height: 1; color: var(--yellow); min-width: 1ch; text-align: center; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
  .score b.bump { animation: bump 0.4s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes bump { 40% { transform: scale(1.4) rotate(-6deg); } }
  .dots { display: flex; gap: clamp(3px, 0.8vmin, 6px); }
  .dots i { width: clamp(14px, 2.4vmin, 20px); height: clamp(14px, 2.4vmin, 20px); border-radius: 50%; background: rgba(255,255,255,0.25); border: 2px solid #fff; }
  .dots i.x { background: var(--x); }
  .dots i.o { background: var(--o); }
  .dots i.d { background: #b8b2c8; }
  .dots i.now { box-shadow: 0 0 0 3px var(--yellow); }
  .turn { font-family: var(--display); font-size: clamp(18px, 3.6vmin, 30px); color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); white-space: nowrap; transition: opacity 0.2s; }
  .turn.mine { color: var(--yellow); animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.08); } }
  .spinbar { display: flex; align-items: center; gap: 10px; padding: 3px 12px; border-radius: 999px; background: rgba(20, 18, 31, 0.5); border: 3px solid #fff; font-family: var(--display); font-size: clamp(14px, 2.6vmin, 22px); }
  .spinbar .cyc { display: flex; align-items: center; gap: 3px; }
  .spinbar .cyc i { font-style: normal; display: grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 6px; background: #fff7e4; }
  .spinbar .cyc em { font-style: normal; font-size: 0.8em; }
  .spinbar .count b { font-weight: 400; color: var(--yellow); font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) {
    /* a phone held upright: the round dots go on a second row under the score */
    .score { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 4px; padding: 4px 6px; }
    .dots { order: 3; width: 100%; justify-content: center; }
    .score img { width: 36px; height: 36px; }
    .score .chip { width: 28px; height: 28px; font-size: 17px; }
    .turn { font-size: 17px; }
  }
  @media (max-height: 520px) {
    /* a phone on its side: the turn line beside the score, all smaller */
    .hudmid { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
    .score img { width: 34px; height: 34px; }
    .score .chip { width: 26px; height: 26px; font-size: 16px; }
    .score b { font-size: 24px; }
    .turn { font-size: 16px; }
    .spinbar { font-size: 13px; padding: 2px 8px; }
  }

  /* your brother's button (1 player) / the high five (2 players): bottom right, big */
  .callbtn {
    position: fixed; z-index: 7; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(88px, 15vmin, 128px); aspect-ratio: 1; border-radius: 50%; padding: 6px;
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink);
    display: grid; place-items: center; font-size: clamp(44px, 8vmin, 64px); line-height: 1;
  }
  .callbtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .callbtn kbd { position: absolute; left: -6px; top: -6px; width: 34px; height: 34px; border-radius: 10px; background: #fff; color: var(--ink); font: 400 18px/30px var(--display); text-align: center; border: 3px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .callbtn kbd { display: none; } }
  .callbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .callbtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 7px 0 var(--ink); } }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; left: 50%; top: 24%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 96vw; }
  .toast {
    font-family: var(--display); font-size: clamp(22px, 4.6vmin, 42px); color: var(--yellow); max-width: 94vw; text-align: center;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 1.9s ease-out forwards;
  }
  .toast.save { color: #7df7c8; font-size: clamp(26px, 6vmin, 52px); animation-duration: 2.4s; }
  .toast.treat { color: #fff; }
  .toast.buddy { color: #ffb02e; }
  .toast.hint { color: #fff; font-size: clamp(18px, 3.6vmin, 30px); }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }

  /* ---------- overlays: round over, match over, pause ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; padding: 14px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.2vh, 20px); padding: clamp(16px, 3.4vmin, 32px); border-radius: 40px; background: linear-gradient(170deg, #fff8e6, #ffe2b8); border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); color: var(--ink); max-width: 96vw; max-height: 96vh; }
  .rface { display: flex; align-items: center; gap: 14px; }
  .rface img { width: clamp(70px, 14vmin, 120px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ink); animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  .rface .big { font-size: clamp(56px, 12vmin, 100px); line-height: 1; animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { from { transform: scale(0.3); } }
  .rtitle { font-family: var(--display); font-size: clamp(30px, 6.6vmin, 60px); line-height: 1.05; text-align: center; color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); max-width: 88vw; }
  .rscore { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-size: clamp(30px, 6vmin, 52px); }
  .rscore .chip { font-size: 1em; }
  .rscore .dash { color: #b8b2c8; }
  .rbtns { display: flex; gap: clamp(14px, 3vmin, 26px); align-items: center; }
  #pause .panel { flex-direction: row; gap: 24px; }
  @media (max-height: 430px) { .panel { gap: 8px; padding: 12px 20px; } .rface img { width: 60px; } .rface .big { font-size: 48px; } .bigbtn { height: 64px; min-width: 64px; font-size: 32px; border-radius: 20px; } }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #9fdcff; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bump 0.8s infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .cycle .sq, .turn.mine, .callbtn.here { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tiles">
    <button class="tile reg" id="goRegular" title="Regular (1)" aria-label="Regular">
      <span class="minigrid"><i class="chip x">✕</i><i class="chip o">◯</i><i></i><i class="chip o">◯</i><i class="chip x win">✕</i><i></i><i></i><i class="chip o">◯</i><i class="chip x win">✕</i></span>
      <b>REGULAR</b><span class="go">▶</span>
    </button>
    <button class="tile spin" id="goSpin" title="Spin (2)" aria-label="Spin">
      <span class="cycle"><span class="sq chip x">✕</span><span class="arr">→</span><span class="sq chip o">◯</span><span class="arr">→</span><span class="sq"></span></span>
      <b>SPIN</b><span class="go">▶</span>
    </button>
  </div>
  <div class="opts">
    <div class="seg" id="segPlayers" role="radiogroup" aria-label="Players">
      <button data-v="1"><span class="emo">👤</span>1 PLAYER</button>
      <button data-v="2"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" role="radiogroup" aria-label="Who are you?">
      <button data-v="teddy"><img alt="" draggable="false">TEDDY<i class="chip x">✕</i></button>
      <button data-v="tommy"><img alt="" draggable="false">TOMMY<i class="chip o">◯</i></button>
    </div>
    <div class="seg" id="segLevel" role="radiogroup" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY<img alt="" draggable="false"></button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL<img alt="" draggable="false"></button>
    </div>
    <div class="duo" id="duo"><img id="duoA" alt="" draggable="false"><i class="chip x">✕</i><span class="vs">·</span><i class="chip o">◯</i><img id="duoB" alt="" draggable="false"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <div class="hudmid">
      <div class="score">
        <div class="side" id="sideL"><img id="faceL" alt=""><i class="chip" id="chipL"></i><b id="scoreL">0</b></div>
        <div class="dots" id="dots"></div>
        <div class="side" id="sideR"><b id="scoreR">0</b><i class="chip" id="chipR"></i><img id="faceR" alt=""></div>
      </div>
      <div class="turn" id="turn"></div>
      <div class="spinbar" id="spinbar"><span class="cyc"><i class="chip x">✕</i><em>→</em><i class="chip o">◯</i><em>→</em><i></i></span><span class="count">🌀 <b id="spinCount">0</b></span></div>
    </div>
    <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  </div>
</div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother"><img id="callFace" alt=""><kbd>T</kbd></button>

<div id="toasts"></div>

<!-- a round is over -->
<div id="roundOver" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="rFace"></div>
    <div class="rtitle" id="rTitle"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="rNext" aria-label="Next round">▶</button>
      <button class="bigbtn" id="rHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- the match is over -->
<div id="matchOver" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="mFace"></div>
    <div class="rtitle" id="mTitle"></div>
    <div class="rscore" id="mScore"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="mAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="mHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start this round again">🔄</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<div id="loading"><span>⭕</span></div>
